name: tier-a-repro
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: Regenerate figures (NumPy/Matplotlib, from committed data)
        run: make figures
      - name: Recompute CIs + dynamic-cache baseline
        run: make cis
      - name: Unit tests
        run: pytest
